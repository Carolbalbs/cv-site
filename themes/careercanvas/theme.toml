name = "CareerCanvas"
license = "MIT"
licenselink = "https://github.com/carolbalbs/careercanvas/blob/main/LICENSE"
description = "A modern, responsive Hugo theme for personal websites and portfolios"
homepage = "https://github.com/carolbalbs/careercanvas"
demosite = "https://carolbalbs.com"
tags = ["blog", "portfolio", "personal", "responsive", "modern", "career", "resume"]
features = ["responsive", "blog", "portfolio", "dark mode", "resume", "career showcase"]
min_version = "0.110.0"

[author]
  name = "Ana Carolina Balbino"
  homepage = "https://carolbalbs.com" 

# Theme Configuration
# Note: Colors are now defined in config.toml for better user control
# These are fallback defaults if not defined in config.toml

[colors]
  # Default theme colors (can be overridden in config.toml)
  main_color = "#33204a"    # Dark Purple
  second_color = "#b560ad"  # Pinkish Purple
  third_color = "#9a72ab"   # Muted Purple

  # Pure colors (these are always the same)
  white = "#fbf5ff"
  black = "#000000"

  # Dark mode background colors (darker variants based on main color)
  dark_bg_primary = "#1a1025"      # Very dark version of main color
  dark_bg_secondary = "#261837"    # Dark secondary based on main color
  dark_bg_tertiary = "#33204a"     # Dark tertiary based on main color 