# Hugo Site Configuration
# This is the main configuration file for the Hugo site
# 
# SECURITY NOTE: Sensitive data (API keys, endpoints) are handled securely:
# - Local development: Use config.local.toml (not committed to git)
# - Production: Environment variables injected via GitHub Actions
# - See comments below for setup instructions
#
baseURL = "https://carolbalbs.github.io/cv-site/"
languageCode = "en-us"
title = "Ana Carolina Balbino"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = "content/en"
    languageName = "English"
    weight = 1
    [languages.en.params]
      tagline = "Think. Code. Solve."
      hero_description = "I am interested in Data Engineering and Artificial Intelligence, and I aim to apply best practices in building data-driven pipelines and solutions within collaborative and innovative environments."
      hero_location = "Salvador, Brazil"
      collab_tags = [
        "Data Science",
        "Engenharia de IA",
        "LLM-based Solutions",
        "PostgreSQL & Data Pipelines",
        "Scrum"
      ]
  [languages.pt-br]
        contentDir = "content/pt-br"
        languageName = "Português (Brasil)"
        weight = 2
        [languages.pt-br.params]
          tagline = "Pense. Programe. Resolva."
          hero_description = "Tenho interesse em Engenharia de Dados e Inteligência Artificial, buscando aplicar boas práticas na construção de pipelines e soluções orientadas a dados, em ambientes colaborativos e inovadores."
          hero_location = "Salvador, Brasil"
          collab_tags = [
            "Ciencia de Dados",
            "Engenharia de IA",
            "Soluções baseadas em Aprendizado de maquina",
            "PostgreSQL e Pipelines de Dados",
            "Scrum"
          ]
[build]
  writeStats = true

[params]
favicon = "images/african-woman.png"
name = "Ana Carolina"
email = "carolbalbinosilva4@gmail.com"
profile_image = "images/about.jpg"
author = "Ana Carolina Balbino"

og_image = "images/about.jpg"

description = "Ana Carolina Balbino's Professional Portfolio"

linkedin_url = "https://www.linkedin.com/in/ana-carolina-balbino"
linkedin_text = "linkedin.com/in/ana-carolina-balbino"
github_url = "https://github.com/carolbalbs"
github_text = "github.com/carolbalbs"

copyright = "© 2026 | Ana Carolina Balbino"


resume_url_en = "../files/[DADOS]CV[en].pdf"
resume_url_pt-br = "../files/[DADOS]CV[pt].pdf"
resume_label = "View CV"

# Contact Form Configuration
# For security, sensitive endpoints are moved to config.local.toml
# In production, these are injected via environment variables in GitHub Actions
# 
# To set up locally, create config.local.toml with:
# [params]
#   pexels_api_key = "your_pexels_api_key_here"
#   formspree_endpoint = "https://formspree.io/f/your_endpoint_here"
#
# For production deployment, add these as GitHub Secrets:
# - PEXELS_API_KEY: Your Pexels API key
# - FORMSPREE_ENDPOINT: Your Formspree endpoint URL


[[params.social]]
icon = "linkedin-in"
url = "https://www.linkedin.com/in/ana-carolina-balbino/"

[[params.social]]
icon = "github"
url = "https://github.com/carolbalbs"

sectionPagesMenu = 'main'


[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

# Security configuration for environment variables
# Note: We now use serverless functions for secure API key handling
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']


# Dynamic Color Palettes Configuration
# A single custom palette using the requested purple colors
[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "royal_purple"
    main_color = "#33204a"    # Dark Purple
    second_color = "#b560ad"  # Pinkish Purple
    third_color = "#9a72ab"   # Muted Purple
  




# Pexels Background Configuration
# This section configures the random background images for the hero section
# The API key is securely handled via environment variables (see comments above)
[params.pexels]
  # Image search queries for random background images
  # Customize this list to change the types of images that appear
  # The system will randomly select from these queries for each page loads
  queries = [
    # "galaxy", "nebula", "planet", "astronomy",
    # "solar system", "black hole", "constellation", "meteor",
    # "comet", "asteroid", "space station", "satellite",
    # "structural long span bridges", "structural skycrapers", "astronomy nasa pictures",
    "universe solar systems nasa pictures", "structural long span bridges",
    "nebula nasa pictures",
  ]